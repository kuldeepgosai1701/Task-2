<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS Motion Tracker with Leaflet</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
     body, html {
     height: 100%;
     font-family: "Inter", sans-serif;
     display: flex;
     flex-direction: column;
     background: #f7f9fc;
    }

    header {
  display: none;
}

.info {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #fff;
  padding: 14px 16px;
  border-radius: 16px;
  z-index: 1001;
  width: 260px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  font-size: 25px;
  line-height: 1.4;
}
.info p:first-child {
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 25px;
}


/* ✅ Buttons Group */
.button-group {
  margin-top: 10px;
  display: flex;
  gap: 10px;
}

.button-group button {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  color: white;
  transition: 0.2s;
  font-size: 18px;
}

.button-group .start {
  background: linear-gradient(135deg, #2a9df4, #00b300);
}
.button-group .stop {
  background: linear-gradient(135deg, #444, #b31515);
}
.button-group .reset {
  background: linear-gradient(135deg, #6c757d, #000000);
}
.button-group button:hover {
  opacity: 0.9;
}

.settings-btn {
  padding: 8px 14px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  color: white;
  font-size: 16px;
  background: linear-gradient(135deg, #2a9df4, #6c63ff); /* blue-purple gradient */
  transition: 0.2s;
}

.settings-btn:hover {
  opacity: 0.9;
  transform: scale(1.05);
}

  .sensitivity-box {
  position: fixed;
  top: 50%;               
  left: 50%;              
  transform: translate(-50%, -50%); /* exact middle */
  background: linear-gradient(135deg, #2a3b8f, #160054);
  color: #fff;
  padding: 25px 30px;
  border-radius: 16px;
  z-index: 1001;
  width: 400px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  font-size: 18px;
  display: none;          
}

.sensitivity-box.open {
  display: block;         
}


.sensitivity-box h3 {
  margin-bottom: 6px;
  font-size: 15px;
  font-weight: 600;
}

.sensitivity-box input[type="range"] {
  width: 100%;
  margin: 8px 0;
}

.history-btn {
  padding: 8px 14px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  color: white;
  font-size: 16px;
  background: linear-gradient(135deg, #ff7f50, #ff4500); /* orange gradient */
  transition: 0.2s;
  margin-left: 8px;
}

.history-btn:hover {
  opacity: 0.9;
  transform: scale(1.05);
}
    #map {
     flex: 1;
     width: 100%;
     position: relative; /* remove absolute positioning */
    }

    .button-group .save {
 background: linear-gradient(135deg, #ff8c00, #ff4500); /* Orange/Red Gradient for Save */
}
.button-group button:hover {
 opacity: 0.9;
}
   </style>
</head>

<body>
<header>
</h1>Motion Tracker</h1>
<button onclick="openHistoryPage()" style="float: right; margin-right: 10px;">History</button>
</header>

<div class="sensitivity-box">
  <h3>Sensitivity</h3>
  <input type="range" id="sensitivityRange" min="0" max="10" step="1" value="5">
  <div>Value: <span id="sensVal">5</span></div>
<button id="saveSensitivity" style="margin-top:8px; padding:6px 10px; border:none;
          border-radius:8px; background:#28a745; color:#fff; font-weight:600; cursor:pointer;">
    💾 Save
  </button>
</div>

<div class="info">
  <p>📍 Tracker Info
  <button class="settings-btn" onclick="toggleSettings()">⚙ Setting</button>
   <button class="history-btn" onclick="openHistoryPage()">📜 History</button></p>
  <p id="location">Location: Fetching...</p>
  <p id="direction">Direction: Calculating...</p>
  <div class="button-group">
  <button class="start" onclick="startTracking()">▶ Start</button>
  <button class="save" onclick="saveVibrationDataToSheet()">📤 Save to Sheet</button>
  <button class="stop"  onclick="stopTracking()">⏸ Stop</button>
  <button class="reset" onclick="resetPage()">⟳ Reset</button></div>
</div>

<!-- Map container -->
<div id="map"></div>

<!-- History Modal -->
<div id="historyModal" 
     style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            background:#fff; padding:20px; border-radius:12px; box-shadow:0px 4px 15px rgba(0,0,0,0.3);
            z-index:2000; width:300px; max-height:400px; overflow:auto;">
  <h3>📌 History</h3>
  <ul id="historyList" style="list-style:none; padding-left:0;"></ul>
  <button onclick="closeHistory()" 
          style="margin-top:10px; background:#d9534f; color:#fff; border:none; padding:6px 12px; border-radius:6px;">Close</button>
</div>

<footer>
<p>Created by Kuldeep Gosai</p>
</footer>
</body>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="main.js"></script>

<script>

  let prevLat = null, prevLon = null;
  let gpsHistory = [];
  let sessionStartTime = null;
  let recordedData = [];
  let sensitivityFactor = 5;
  
let vibrationEventActive = false;
let vibrationStartTime = null;
let vibrationStartLat = null;
let vibrationStartLon = null;
//const GOOGLE_SHEETS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzo-0DlvihF3MYJoTZsPxXs22IOGlpe2zSAUflnZqxrBV_VQTF5X0RpZBXxb1YEvi0V/exec';

let unsavedVibrationEvents = JSON.parse(localStorage.getItem('unsavedVibrationEvents')) || [];

  // Gyroscope values track karne ke liye
window.addEventListener("deviceorientation", function(event) {
    let alpha = event.alpha; // rotation around z-axis
    let beta = event.beta;   // rotation around x-axis
    let gamma = event.gamma; // rotation around y-axis

    recordedData.push({ alpha, beta, gamma, time: Date.now() });
     // Keep only the last 10 entries in memory
    if (recordedData.length > 10) {
     recordedData.shift();
     }

    // Save automatically in localStorage (hidden background saving)
    localStorage.setItem("recordedData", JSON.stringify(recordedData));

    
    // Sudden change detection (pothole condition)
    if (Math.abs(beta) > sensitivityFactor * 5 || Math.abs(gamma) > sensitivityFactor * 5) {
        vibratedRecently = true;
        if (navigator.vibrate) navigator.vibrate(300); // vibrate for 0.3s
    } else {
        vibratedRecently = false;
    }
}, true);
  
  let vibratedRecently = false;
  let trackingInterval = null;

  const locationText = document.getElementById("location");
  const directionText = document.getElementById("direction");
  const sensitivityRange = document.getElementById("sensitivityRange");
  const sensVal = document.getElementById("sensVal");

  // ✅ Save button event
document.getElementById("saveSensitivity").addEventListener("click", function () {
  sensitivityFactor = parseInt(sensitivityRange.value); // slider value ko logic me save karo
  sensVal.textContent = sensitivityFactor;              // UI me update karo
  alert("Sensitivity saved: " + sensitivityFactor);
});

  // Leaflet map setup
  let map = L.map('map').setView([0, 0], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let dotMarker = L.circleMarker([0, 0], {
    radius: 10,
    fillColor: "#007bff",
    color: "#003366",
    weight: 2,
    opacity: 1,
    fillOpacity: 0.9
  }).addTo(map);

  let pathCoords = [];
  let pathLine = L.polyline(pathCoords, { color: 'blue' }).addTo(map);

  function analyzeVibrations() {
  const sliderValue = parseInt(sensitivityRange.value);

  // Select last N entries based on slider
  const entriesToAnalyze = recordedData.slice(-sliderValue);

  // Perform vibration check only on these entries
  entriesToAnalyze.forEach(entry => {
    if (entry.vibration === "Yes") {
      console.log("Vibration detected in last", sliderValue, "entries");
    }
  });
}

function calculateDirection(lat1, lon1, lat2, lon2) {
  // degrees → radians
  const toRad = (deg) => (deg * Math.PI) / 180;
  lat1 = toRad(lat1);
  lon1 = toRad(lon1);
  lat2 = toRad(lat2);
  lon2 = toRad(lon2);

  // formula for bearing
  const y = Math.sin(lon2 - lon1) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);

  let brng = Math.atan2(y, x) * (180 / Math.PI);
  brng = (brng + 360) % 360; // normalize to 0–360
  return brng;
}

function getDirectionName(angle) {
  if (angle >= 337.5 || angle < 22.5) return "North";
  if (angle >= 22.5 && angle < 67.5) return "North-East";
  if (angle >= 67.5 && angle < 112.5) return "East";
  if (angle >= 112.5 && angle < 157.5) return "South-East";
  if (angle >= 157.5 && angle < 202.5) return "South";
  if (angle >= 202.5 && angle < 247.5) return "South-West";
  if (angle >= 247.5 && angle < 292.5) return "West";
  if (angle >= 292.5 && angle < 337.5) return "North-West";
  return "Unknown";
}

// --- Direction calculation and permission setup ---
function handleOrientation(event) {
  if (event.alpha !== null) {
    let heading = 360 - event.alpha; // Normalize to make 0° = North
    if (heading < 0) heading += 360;

    const direction = getDirectionName(heading);
    document.getElementById("direction").textContent =
      `Direction: ${direction} (${Math.round(heading)}°)`;
  } else {
    document.getElementById("direction").textContent =
      "Direction: Unavailable";
  }
}

// iOS Safari Permission Handling
if (typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function") {
  document.body.addEventListener("click", () => {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
        } else {
          alert("Direction sensor permission denied!");
        }
      })
      .catch(console.error);
  });
} else {
  // For Android and non-iOS browsers
  window.addEventListener("deviceorientation", handleOrientation);
}

function checkVibration(data) {
    return data.some(entry => entry.vibration === true);
}

 function showLocation(position) {
   const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const timestamp = new Date().toISOString(); // store in ISO format

    // Get sessions array from localStorage (stores ALL data: red and blue dot points)
     let sessions = JSON.parse(localStorage.getItem("sessions")) || [];

     // If no session exists, create one
       if (sessions.length === 0) {
       sessions.push({
       start: timestamp,
       end: null,
       data: []
       });
       }

    // Reference current session
    let currentSession = sessions[sessions.length - 1];

    currentSession.data.push({
    lat, 
   lon, 
    time: timestamp,
    vibration: vibratedRecently // <-- store vibration state here for all points
});
if (currentSession.data.length > 10) {
    currentSession.data.shift();
}

 // Save back to localStorage
   localStorage.setItem("sessions", JSON.stringify(sessions));

 // UI update
 locationText.textContent = `Location: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
 pathCoords.push([lat, lon]);
 pathLine.setLatLngs(pathCoords);
 dotMarker.setLatLng([lat, lon]);
 map.setView([lat, lon]);

// Calculate direction based on previous position
 if (prevLat !== null && prevLon !== null) {
 
if (prevLat !== null && prevLon !== null) {
 const bearing = calculateDirection(prevLat, prevLon, lat, lon);
 directionText.textContent = `Direction: ${getDirectionName(bearing)} (${Math.round(bearing)}°)`;
} else {
 directionText.textContent = "Direction: Calculating...";
}

 }

 prevLat = lat;
 prevLon = lon;

 // 🔴 Vibration detection logic
 const isCurrentlyVibrating = vibratedRecently;

 if (isCurrentlyVibrating) {

  L.circleMarker([lat, lon], {
    radius: 6,
    fillColor: "red",
    color: "darkred",
    weight: 2,
    opacity: 1,
    fillOpacity: 0.9
  }).addTo(map);

  if (!vibrationEventActive) {
    vibrationEventActive = true;
    vibrationStartTime = timestamp;

    // ✅ Ensure start coordinates exist
    if (prevLat !== null && prevLon !== null) {
      vibrationStartLat = prevLat;
      vibrationStartLon = prevLon;
    }

    // ✅ Extra guard (in case prevLat/prevLon were null)
    if (!vibrationStartLat || !vibrationStartLon) {
      vibrationStartLat = lat;
      vibrationStartLon = lon;
    }

    console.log("Vibration Event Started at:", timestamp);
  }
}


 } else {
 // Vibration has stopped
if (vibrationEventActive) {
 // Log the completed Red Dot event to the UNSAVED list
const endTime = timestamp;
 const endLat = lat;
 const endLon = lon;
 
 console.log("Vibration Event Ended, Storing for Save to Sheet...");

 const newVibrationEvent = {
 startLat: vibrationStartLat,
 startLon: vibrationStartLon,
 endLat: endLat,
 endLon: endLon,
 startTime: vibrationStartTime,
 endTime: endTime
 };

 // ✅ Pushes only Red Dot events to the dedicated array for later sheet export
 unsavedVibrationEvents.push(newVibrationEvent);
 localStorage.setItem('unsavedVibrationEvents', JSON.stringify(unsavedVibrationEvents));

 // Reset event state
 vibrationEventActive = false;
 vibrationStartTime = null;
 vibrationStartLat = null; // Important: Clear all start data
 vibrationStartLon = null; // Important: Clear all start data
 }
 }
 }


  function showError(error) {
  console.error("GPS Error:", error);
  switch(error.code) {
    case error.PERMISSION_DENIED:
      locationText.textContent = "Location: Permission denied";
      break;
    case error.POSITION_UNAVAILABLE:
      locationText.textContent = "Location: Position unavailable";
      break;
    case error.TIMEOUT:
      locationText.textContent = "Location: Timeout";
      break;
    default:
      locationText.textContent = "Location: Unknown error";
      break;
  }
}
function getDirectionFromAngle(angle) {
  // Normalize angle (-180 se 180 ko 0–360 me convert)
  angle = (angle + 360) % 360;

  if (angle >= 337.5 || angle < 22.5) return "East";
  if (angle >= 22.5 && angle < 67.5) return "North-East";
  if (angle >= 67.5 && angle < 112.5) return "North";
  if (angle >= 112.5 && angle < 157.5) return "North-West";
  if (angle >= 157.5 && angle < 202.5) return "West";
  if (angle >= 202.5 && angle < 247.5) return "South-West";
  if (angle >= 247.5 && angle < 292.5) return "South";
  if (angle >= 292.5 && angle < 337.5) return "South-East";
  
  return "Unknown";
}

function saveDataToFile() {

  const numberOfEntries = parseInt(sensitivityRange.value);

  // last N entries select 
  const recentData = recordedData.slice(-numberOfEntries);

  if (recentData.length === 0) {
    alert("No data to save.");
    return;
  }

let fileContent = "Alpha\tBeta\tGamma\tVibration\tDirection\n";
recentData.forEach(entry => {
  fileContent += `${entry.alpha.toFixed(2)}\t${entry.beta.toFixed(2)}\t${entry.gamma.toFixed(2)}\t${entry.vibration}\t${entry.direction}\n`;
});



  // download trigger 
  const blob = new Blob([fileContent], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `motion_data_last_${numberOfEntries}.txt`; 
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

let watchId = null;

 function startTracking() {
  if ("geolocation" in navigator) {
    // ✅ continuous GPS tracking
    trackingInterval = navigator.geolocation.watchPosition(
      showLocation,
      showError,
      {
        enableHighAccuracy: true,   // GPS chip use karega
        timeout: 10000,             // max wait 10 sec
        maximumAge: 0               // purana cache use na kare
      }
    );
  } else {
    alert("Geolocation not supported in this browser.");
  }
}

function stopTracking() {
  if (trackingInterval) {
    navigator.geolocation.clearWatch(trackingInterval);
    trackingInterval = null;
  }
}

function resetPage() {
  gpsHistory = [];
  recordedData = [];
  pathCoords = [];
  pathLine.setLatLngs(pathCoords);
  dotMarker.setLatLng([0, 0]);
  map.setView([0, 0], 18);

  prevLat = null;
  prevLon = null;
  locationText.textContent = "Location: Reset...";
  directionText.textContent = "Direction: Reset...";
}

function toggleHistory() {
    const modal = document.getElementById("historyModal");
    const list = document.getElementById("historyList");
    list.innerHTML = "";

    if (modal.style.display === "none") {
        const sessions = JSON.parse(localStorage.getItem("sessions")) || [];

        if (sessions.length === 0) {
            alert("No history available yet.");
            return;
        }

        
        sessions.forEach((session, index) => {
            const startTime = new Date(session.start);
            const endTime = session.end ? new Date(session.end) : null;

            const li = document.createElement("li");
            li.style.cursor = "pointer";
            li.textContent = endTime
                ? `Session ${index + 1}: ${startTime.toLocaleString()} - ${endTime.toLocaleString()}`
                : `Session ${index + 1}: ${startTime.toLocaleString()} - Ongoing`;

            li.onclick = () => {
                const path = session.data.map(p => [p.lat, p.lon]);
                if (path.length > 0) {
                    pathLine.setLatLngs(path);
                    dotMarker.setLatLng(path[path.length - 1]);
                    map.fitBounds(path);
                } else {
                    alert("No data in this session.");
                }
                closeHistory();
            };

            list.appendChild(li);
        });

        modal.style.display = "block";
    } else {
        modal.style.display = "none";
    }
}

function closeHistory() {
    document.getElementById("historyModal").style.display = "none";
}

function showHistoryPath(startTime, endTime) {
    // filter gpsHistory for selected time range
    const filteredPath = gpsHistory.filter(p => p.time >= startTime && p.time <= endTime)
                                   .map(p => [p.lat, p.lon]);

    if (filteredPath.length === 0) {
        alert("No movement in this interval.");
        return;
    }

    // clear existing path
    pathLine.setLatLngs(filteredPath);
    dotMarker.setLatLng(filteredPath[filteredPath.length - 1]);
    map.fitBounds(filteredPath);
    closeHistory();
}


  function openHistoryPage() {
    window.location.href = "history.html"; 
  }

function toggleSettings() {
  const box = document.querySelector(".sensitivity-box");
  box.classList.toggle("open");
}

// Close sensitivity box if clicked outside
document.addEventListener("click", function(event) {
  const box = document.querySelector(".sensitivity-box");
  const settingsBtn = document.querySelector(".settings-btn");

  if (!box.contains(event.target) && !settingsBtn.contains(event.target)) {
    box.classList.remove("open");
  }
});

window.onload = function() {
  const savedHistory = localStorage.getItem("gpsHistory");
  const savedRecorded = localStorage.getItem("recordedData");

  if (savedHistory) {
    gpsHistory = JSON.parse(savedHistory);
    pathCoords = gpsHistory.map(p => [p.lat, p.lon]);
    pathLine.setLatLngs(pathCoords);
    if (pathCoords.length > 0) {
      dotMarker.setLatLng(pathCoords[pathCoords.length - 1]);
      map.fitBounds(pathCoords);
    }
  }

  if (savedRecorded) {
    recordedData = JSON.parse(savedRecorded);
  }

     localStorage.removeItem("currentSession");

  gpsHistory = [];
  recordedData = [];
  pathCoords = [];
  pathLine.setLatLngs(pathCoords);
  dotMarker.setLatLng([0, 0]);
  map.setView([0, 0], 18);
};

async function saveVibrationDataToSheet() {

    console.log("Unsaved vibration events:", unsavedVibrationEvents);

    if (unsavedVibrationEvents.length === 0) {
        alert("No new pothole data to save to Google Sheet.");
        return;
    }

    const totalEvents = unsavedVibrationEvents.length;
    let successfulSaves = 0;

    for (const event of unsavedVibrationEvents) {
        try {
            console.log("Sending event →", event);

            const res = await sendToGoogleSheet(event);

            console.log("Server response →", res);

            // Optional: verify success flag
            if (res && res.result === 'success') {
                successfulSaves++;
            } else {
                console.warn("Server returned unexpected response:", res);
            }

        } catch (error) {
            console.error("❌ Failed to send event:", event, error);
        }
    }

    // 🚦Final result & cleanup
    if (successfulSaves === totalEvents) {
        alert(`✅ Successfully saved ${successfulSaves} pothole events to Google Sheet.`);
        unsavedVibrationEvents = [];
        localStorage.removeItem("unsavedVibrationEvents");
    } else {
        alert(`⚠️ Saved ${successfulSaves} out of ${totalEvents} events. Some failed — try again.`);
        // keep remaining ones so they can be retried later
    }
}

</script>
</body>
</html>
